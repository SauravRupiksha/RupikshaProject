# =========================================
# APPLICATION
# =========================================

spring.application.name=recharge


# =========================================
# SERVER CONFIG
# =========================================

server.port=8080


# =========================================
# DATABASE CONFIG (AWS RDS)
# =========================================

spring.datasource.url=jdbc:mysql://database-2.cd2eyywiufeo.ap-south-1.rds.amazonaws.com:3306/venus_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

spring.datasource.username=admin
spring.datasource.password=Ajay9102

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================
# HIKARI CONNECTION POOL
# =========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000


# =========================================
# JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true


# =========================================
# JACKSON JSON CONFIG
# =========================================

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


# =========================================
# LOGGING
# =========================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.rupiksha.recharge=DEBUG


# =========================================
# ASYNC / REQUEST TIMEOUT
# =========================================

spring.mvc.async.request-timeout=30000


# =========================================
# TOMCAT CONFIG
# =========================================

server.tomcat.connection-timeout=30000
server.tomcat.max-connections=200
server.tomcat.accept-count=100


# =========================================
# VENUS API CONFIG
# =========================================

venus.base.url=http://api.venusrecharge.com

venus.auth.key=10092
venus.auth.pass=RUPIKSHA@816


# =========================================
# ACTUATOR
# =========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always